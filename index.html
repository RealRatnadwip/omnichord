<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:url" content="https://omnichord.745482.xyz">
    <meta property="og:title" content="Omnichord - Realratnadwip Network">
    <meta property="og:description" content="an omnichord in a web browser.">
    <meta property="og:image" content="https://omnichord.745482.xyz/image.png">
    <meta property="og:image:url" content="https://omnichord.745482.xyz/image.png">
    <link rel="apple-touch-icon" sizes="76x76" href="./icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./icon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./icon.png">
    <title>Omnichord</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Synth LCD Dashboard Bar -->
    <div class="synth-dashboard">
      <span class="dash-brand">omnichord // realratnadwip network</span>
      <span class="dash-divider">|</span>
      <span class="dash-item">chord:<span id="dash-chord">[none]</span></span>
      <span class="dash-item">rhythm:<span id="dash-rhythm">none</span></span>
      <span class="dash-item">tempo:<span id="dash-tempo">1.00x</span></span>
      <span class="dash-item">fx:<span id="dash-fx">off</span></span>
      <span class="dash-item">mode:<span id="dash-mode">perform</span></span>
    </div>

    <!-- Controls Overlay (Horizontal Strip at Bottom) -->
    <nav id="config">
      <button id="tempo">tempo</button>
      <button id="labels">labels <span class="led">○</span></button>
      <button id="fixed">fixed <span class="led">○</span></button>
      <button id="fx">fx <span class="led">○</span></button>
      <button id="invert" class="active">invert <span class="led">●</span></button>
      <a id="config-link" href="#config">config</a>
    </nav>
    <canvas></canvas>

    <div class="branding">
      omnichord &bull; a <a href="https://ratnadwip.com" target="_blank" rel="noopener">realratnadwip network</a> project
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.36/Tone.min.js"></script>
    <script type="module" src="chords.js"></script>
    <script type="module" src="controller.js"></script>
    <script type="module" src="sounds.js"></script>
    <script type="module" src="touch.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
